[package]
name = "findarat"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Linux-first local network discovery and device intelligence"
license = "MIT"
repository = "https://example.invalid/findarat"
readme = "README.md"
keywords = ["network", "discovery", "arp", "mdns", "tui"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
csv = "1.4"
dns-lookup = "4.0"
if-addrs = "0.15"
ipnet = { version = "2.12", features = ["serde"] }
quick-xml = "0.42"
ratatui = "0.30"
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.24"

[profile.release]
lto = "thin"
strip = true
